<header class="header glass-effect" role="banner">
  <div class="container header-container">
    <!-- Left: Mobile Toggle & Brand Logo -->
    <div class="header-left">
      <button
        type="button"
        class="mobile-toggle-btn"
        (click)="toggleMobileMenu()"
        aria-label="Toggle navigation menu">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" x2="20" y1="12" y2="12"></line>
          <line x1="4" x2="20" y1="6" y2="6"></line>
          <line x1="4" x2="20" y1="18" y2="18"></line>
        </svg>
      </button>

      <!-- Brand Logo -->
      <a routerLink="/" class="brand-logo" aria-label="Global E-Commerce Home">
        <span class="logo-mark">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"></path>
            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
            <path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"></path>
            <path d="M2 7h20"></path>
          </svg>
        </span>
        <span class="logo-text">AURA<span class="logo-accent">GLOBAL</span></span>
      </a>
    </div>

    <!-- Center: Global Search Bar -->
    <div class="header-center">
      <form class="search-form" (ngSubmit)="onSearchSubmit()" role="search">
        <div class="search-input-wrapper">
          <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input
            type="search"
            class="search-input"
            placeholder="Search products, brands, luxury variants..."
            [ngModel]="searchQuery()"
            (ngModelChange)="searchQuery.set($event)"
            name="searchQuery"
            autocomplete="off"
            aria-label="Search store products">
          <button type="submit" class="search-submit-btn" aria-label="Submit search">
            Search
          </button>
        </div>
      </form>
    </div>

    <!-- Right: User Account, Wishlist, Cart -->
    <div class="header-right">
      <!-- Account Dropdown -->
      <div class="user-action-menu">
        <button
          type="button"
          class="action-btn"
          (click)="toggleUserMenu()"
          aria-label="User Account Options">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span class="action-label">Account</span>
        </button>

        <div *ngIf="isUserMenuOpen()" class="dropdown-menu shadow-lg">
          <a routerLink="/login" class="menu-item font-semibold text-accent" (click)="isUserMenuOpen.set(false)">Sign In / Register</a>
          <div class="menu-divider"></div>
          <a routerLink="/account" class="menu-item" (click)="isUserMenuOpen.set(false)">My Profile</a>
          <a routerLink="/account/orders" class="menu-item" (click)="isUserMenuOpen.set(false)">Order History</a>
          <a routerLink="/admin" class="menu-item" (click)="isUserMenuOpen.set(false)">Admin Dashboard</a>
        </div>
      </div>

      <!-- Wishlist Button -->
      <a routerLink="/wishlist" class="action-btn" aria-label="View Wishlist">
        <div class="icon-with-badge">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path>
          </svg>
          <span *ngIf="wishlistCount() > 0" class="badge-count">{{ wishlistCount() }}</span>
        </div>
        <span class="action-label">Wishlist</span>
      </a>

      <!-- Cart Button -->
      <a routerLink="/cart" class="action-btn cart-btn" aria-label="View Shopping Cart">
        <div class="icon-with-badge">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path>
            <path d="M3 6h18"></path>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
          <span class="badge-count">{{ cartCount() }}</span>
        </div>
        <span class="action-label">Cart</span>
      </a>
    </div>
  </div>
</header>
