<div *ngIf="isOpen" class="mobile-drawer-backdrop" (click)="close()" aria-hidden="true"></div>

<aside class="mobile-drawer" [class.open]="isOpen" aria-label="Mobile Navigation Drawer">
  <!-- Drawer Header -->
  <div class="drawer-header">
    <div class="drawer-brand">
      <span class="logo-mark-sm">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"></path>
          <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
          <path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"></path>
          <path d="M2 7h20"></path>
        </svg>
      </span>
      <span class="brand-title">AURA GLOBAL</span>
    </div>

    <button type="button" class="drawer-close-btn" (click)="close()" aria-label="Close navigation menu">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <!-- Mobile Search -->
  <div class="drawer-search">
    <form (ngSubmit)="onSearch()">
      <div class="search-box">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input
          type="search"
          placeholder="Search products..."
          [ngModel]="searchQuery()"
          (ngModelChange)="searchQuery.set($event)"
          name="drawerSearch"
          class="search-input">
      </div>
    </form>
  </div>

  <!-- Navigation Links -->
  <div class="drawer-nav">
    <span class="section-title">Navigation</span>
    <ul class="nav-menu">
      <li><a routerLink="/" (click)="close()" class="nav-link">Home</a></li>
      <li><a routerLink="/products" (click)="close()" class="nav-link">Shop All Products</a></li>
      <li><a routerLink="/products" [queryParams]="{ isFeatured: 'true' }" (click)="close()" class="nav-link highlight">🔥 Deals & Flash Sale</a></li>
      <li><a routerLink="/orders/tracking" (click)="close()" class="nav-link">Track Order</a></li>
    </ul>

    <!-- Categories Section -->
    <span class="section-title">Departments</span>
    <ul class="nav-menu">
      <li *ngFor="let cat of categories()">
        <a [routerLink]="['/products']" [queryParams]="{ categoryId: cat.id }" (click)="close()" class="nav-link">
          {{ cat.name }}
        </a>
      </li>
    </ul>

    <!-- Account Section -->
    <span class="section-title">My Account</span>
    <ul class="nav-menu">
      <li><a routerLink="/login" (click)="close()" class="nav-link">Sign In / Register</a></li>
      <li><a routerLink="/account" (click)="close()" class="nav-link">Customer Profile</a></li>
      <li><a routerLink="/wishlist" (click)="close()" class="nav-link">Saved Wishlist</a></li>
      <li><a routerLink="/admin" (click)="close()" class="nav-link">Admin Portal</a></li>
    </ul>
  </div>
</aside>
